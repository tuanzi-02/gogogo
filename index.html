<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>TOEIC News Notes</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.3/html2pdf.bundle.min.js" defer></script>
  <script>
    try {
      const savedTheme = localStorage.getItem("toeic-news-theme");
      if (["a", "b", "c"].includes(savedTheme)) document.documentElement.dataset.theme = savedTheme;
    } catch (_) { /* 本機瀏覽器若停用儲存，仍可正常切換主題。 */ }
  </script>
  <style>
    :root{--canvas:#C2D1D6;--paper:#EFF4F5;--ink:#27303A;--vocab-head:#8099A7;--mask:#2A3B4C;--navy:#2A3B4C;--teal:#3F518F;--muted:#5c6b78;--line:#d5dfe3;--panel:#EAEFF1;--nav-control:#2A3B4C;--nav-text:#EFF4F5}
    html[data-theme="b"]{--canvas:#DFD7D7;--paper:#F8F5F0;--ink:#3A1F11;--vocab-head:#AFBE9D;--mask:#678C6E;--navy:#3A1F11;--teal:#678C6E;--muted:#756358;--line:#e5ddd3;--panel:#F5ECDE;--nav-control:#4a3326;--nav-text:#F8F5F0}
    html[data-theme="c"]{--canvas:#EED1D1;--paper:#FCF1F1;--ink:#402148;--vocab-head:#DABAB6;--mask:#9A5D6F;--navy:#402148;--teal:#9A5D6F;--muted:#7a5f6c;--line:#ead8d8;--panel:#F5EADD;--nav-control:#593556;--nav-text:#FCF1F1}
    *{box-sizing:border-box}
    body{margin:0;background:var(--canvas);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.7}
    button,select{font:inherit}
    button{cursor:pointer}
    :focus-visible{outline:3px solid #d9a54d;outline-offset:2px}
    .topbar{height:56px;max-height:56px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 max(16px,calc((100vw - 1120px)/2));background:var(--navy);color:var(--nav-text)}
    .nav-left,.nav-right,.tabs{display:flex;align-items:center;gap:8px}
    .nav-left{min-width:0;overflow-x:auto;scrollbar-width:none}
    .nav-left::-webkit-scrollbar{display:none}
    .date-select{flex:none;width:126px;height:34px;padding:0 8px;border:1px solid #b6a69a;border-radius:7px;background:var(--nav-control);color:var(--nav-text);font-size:.82rem;font-weight:700}
    .tabs{flex:none;gap:3px}
    .tab{height:34px;padding:0 12px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--nav-text);font-size:.83rem;font-weight:750;white-space:nowrap}
    .tab:hover{background:var(--nav-control)}
    .tab[aria-selected="true"]{background:var(--mask);color:var(--nav-text)}
    .nav-right{flex:none;gap:5px}
    .icon-button{display:grid;place-items:center;width:34px;height:34px;padding:0;border:1px solid #b6a69a;border-radius:7px;background:var(--nav-control);color:var(--nav-text);transition:background .16s,border-color .16s,transform .1s}
    .icon-button:hover{background:var(--mask);border-color:var(--nav-text)}
    .icon-button:active,.mask:active,.vocab-page-button:active{transform:scale(.95)}
    #toggle-all[aria-pressed="true"]{background:var(--mask);border-color:var(--nav-text);box-shadow:inset 0 0 0 1px var(--nav-text)}
    #toggle-all[aria-pressed="true"]:hover{filter:brightness(.92)}
    .eye-open{display:none}#toggle-all[aria-pressed="true"] .eye-open{display:block}#toggle-all[aria-pressed="true"] .eye-closed{display:none}
    .icon-button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    #print-button.is-exporting{width:auto;padding:0 10px;cursor:wait}
    #print-button.is-exporting svg{display:none}
    .export-label{display:none;white-space:nowrap;font-size:.75rem;font-weight:800}
    #print-button.is-exporting .export-label{display:inline}
    .theme-switcher{display:flex;align-items:center;gap:4px;margin-right:5px}
    .theme-swatch{width:22px;height:22px;padding:0;border:2px solid transparent;border-radius:50%;box-shadow:0 0 0 1px #b9b0a7;transition:transform .1s,box-shadow .16s}
    .theme-swatch:hover{transform:scale(1.12)}
    .theme-swatch:active{transform:scale(.95)}
    .theme-swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--nav-text)}
    .theme-swatch[data-theme-choice="a"]{background:linear-gradient(135deg,#EFF4F5 0 50%,#8099A7 50% 75%,#2A3B4C 75%)}
    .theme-swatch[data-theme-choice="b"]{background:linear-gradient(135deg,#F8F5F0 0 50%,#AFBE9D 50% 75%,#678C6E 75%)}
    .theme-swatch[data-theme-choice="c"]{background:linear-gradient(135deg,#FCF1F1 0 50%,#DABAB6 50% 75%,#9A5D6F 75%)}
    .page{max-width:1120px;margin:20px auto 64px;padding:0 22px}
    .status{min-height:22px;margin:0 0 9px;color:var(--muted);font-size:.79rem}
    .sheet{overflow:hidden;border:1px solid var(--line);border-radius:20px;background:var(--paper);box-shadow:0 16px 42px #35292716}
    .sheet.pdf-exporting{width:710px;max-width:710px;margin:0;border-radius:0;overflow:visible;box-shadow:none}
    .pdf-exporting .table-wrap{overflow:visible}
    .pdf-exporting .vocab{min-width:0}
    .pdf-exporting .vocab-pages{display:none}
    .pdf-exporting .vocab tr.is-offpage{display:table-row}
    .pdf-exporting .reveal:not(.is-covered) .mask{display:none}
    .pdf-exporting .question,.pdf-exporting .vocab tr,.pdf-exporting .passage{break-inside:avoid;page-break-inside:avoid}
    .pdf-modal[hidden]{display:none}
    .pdf-modal{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:16px;background:#1d1b1bcc}
    .pdf-dialog{display:flex;flex-direction:column;width:min(100%,960px);height:min(92vh,1100px);overflow:hidden;border:1px solid var(--line);border-radius:12px;background:var(--paper);box-shadow:0 24px 60px #0005}
    .pdf-dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;background:var(--paper)}
    .pdf-dialog-title{margin:0;color:var(--ink);font-size:1rem;font-weight:800}
    .pdf-dialog-actions{display:flex;gap:8px;flex-wrap:wrap}
    .pdf-dialog-button{padding:7px 12px;border:1px solid var(--mask);border-radius:6px;background:var(--mask);color:var(--nav-text);font-size:.84rem;font-weight:750;transition:filter .16s,transform .1s}
    .pdf-dialog-button:hover{filter:brightness(.9)}
    .pdf-dialog-button:active{transform:scale(.95)}
    .pdf-dialog-button:disabled{opacity:.55;cursor:wait}
    .pdf-dialog-button.secondary{background:transparent;color:var(--ink)}
    .pdf-dialog-body{display:grid;place-items:center;flex:1;min-height:0;background:var(--panel)}
    .pdf-preview-status{padding:16px;color:var(--ink);text-align:center}
    .pdf-preview-frame{width:100%;height:100%;border:0;background:#fff}
    .pdf-preview-frame[hidden],.pdf-preview-status[hidden]{display:none}
    .sheet-head{padding:30px 38px 26px;border-bottom:1px solid var(--line);background:var(--paper)}
    .meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--muted);font-size:.78rem;font-weight:750}
    .badge{padding:3px 9px;border-radius:5px;background:var(--vocab-head);color:var(--ink)}
    .dot{color:#aeb8b9}
    h1{margin:12px 0 8px;font-size:clamp(1.45rem,2.6vw,2.05rem);line-height:1.35}
    .summary{max-width:780px;margin:0;color:var(--muted);font-size:.95rem}
    .overview{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}
    .overview span{padding:4px 9px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--ink);font-size:.74rem;font-weight:750}
    .section{padding:30px 38px 34px;border-bottom:1px solid var(--line)}
    .section:last-child{border:0}
    .section-heading{display:flex;align-items:baseline;gap:12px;margin-bottom:17px}
    .section-number{color:var(--teal);font-family:Georgia,serif;font-size:1.35rem;font-weight:700}
    h2{margin:0;font-size:1.2rem;line-height:1.35}
    .section-en{margin-left:auto;color:#8a989b;font-family:Georgia,serif;font-size:.85rem;font-style:italic}
    .article-copy{max-width:78ch;color:var(--ink);font-family:Georgia,"Times New Roman",serif;font-size:1.1rem;line-height:1.88}
    .article-copy p{margin:0 0 15px}
    .article-copy p:last-child{margin:0}
    .small-heading{margin:20px 0 8px;color:var(--ink);font-size:.86rem;font-weight:800}
    .reveal{position:relative;min-height:58px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
    .reveal-content{padding:12px 15px}
    .reveal-content p{margin:0 0 8px}
    .reveal-content p:last-child{margin:0}
    .reveal.is-covered .reveal-content{visibility:hidden}
    .mask{position:absolute;inset:0;display:grid;place-items:center;width:100%;min-height:100%;padding:5px;border:0;border-radius:8px;background:var(--mask);color:var(--nav-text);font-size:.8rem;font-weight:800;text-align:center;transition:background .16s,transform .1s}
    .mask:hover{filter:brightness(.9)}
    .reveal:not(.is-covered) .mask{position:static;display:block;min-height:0;padding:5px 12px;border-top:1px solid var(--line);border-radius:0 0 8px 8px;background:transparent;color:var(--ink);text-align:right;font-size:.72rem}
    .reveal:not(.is-covered) .mask:hover{background:var(--vocab-head)}
    .source-row{margin-top:14px}
    .source-link{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid var(--teal);border-radius:6px;color:var(--teal);font-size:.78rem;font-weight:800;text-decoration:none}
    .source-link:hover{background:var(--panel)}
    .vocab-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    .vocab-toolbar .section-heading{margin:0}
    .vocab-pages{display:flex;flex:none;gap:4px}
    .vocab-page-button{padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font-size:.75rem;font-weight:800;transition:background .16s,transform .1s}
    .vocab-page-button:hover{background:var(--vocab-head)}
    .vocab-page-button[aria-pressed="true"]{border-color:var(--mask);background:var(--mask);color:var(--nav-text)}
    .vocab tr.is-offpage{display:none}
    .table-wrap{overflow-x:auto}
    .vocab{width:100%;border:none;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:.84rem}
    .vocab thead{background:var(--vocab-head);border-radius:8px}
    .vocab th{padding:12px;border:none;background:var(--vocab-head);color:var(--ink);font-size:.74rem;line-height:1.4}
    .vocab th:first-child{border-radius:8px 0 0 8px}
    .vocab th:last-child{border-radius:0 8px 8px 0}
    .vocab td{padding:14px 12px;border:none;overflow-wrap:anywhere}
    .vocab th,.vocab td{text-align:left;vertical-align:middle}
    .vocab tbody tr:hover{background:var(--panel)}
    .vocab th:nth-child(1){width:22%}.vocab th:nth-child(2){width:16%}.vocab th:nth-child(3){width:17%}.vocab th:nth-child(4){width:18%}.vocab th:nth-child(5){width:27%}
    .term{color:var(--ink);font-weight:850}.pos{color:var(--muted);font-size:.77rem}
    .collocation{margin-top:4px;color:var(--muted);font-size:.8rem}
    .vocab .reveal{min-height:52px}.vocab .reveal-content{padding:8px}.vocab .mask{font-size:.7rem}
    .vocab .reveal:not(.is-covered){min-height:0;border:none;border-radius:0;background:transparent;padding:0}
    .vocab .reveal:not(.is-covered) .reveal-content{padding:0}
    .vocab .reveal:not(.is-covered) .mask{display:inline;width:auto;min-height:0;margin-top:3px;padding:0;border:none;border-radius:0;background:transparent;color:var(--teal);text-align:left;font-size:.66rem}
    .vocab .reveal:not(.is-covered) .mask:hover{background:transparent;color:var(--mask);text-decoration:underline}
    .example{color:var(--ink);font-family:Georgia,serif;line-height:1.58}
    .question-list{display:grid;gap:13px}
    .question{padding:18px 19px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
    .question-top{display:flex;gap:11px;align-items:baseline}
    .q-number{flex:none;color:var(--teal);font-family:Georgia,serif;font-size:1rem;font-weight:700}
    .prompt{margin:0;font-size:1rem;font-weight:650}
    .options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 16px;margin:11px 0 13px 26px;padding:0;list-style:none}
    .options li{color:var(--ink);font-size:.9rem}
    .option-letter{display:inline-block;min-width:25px;color:var(--teal);font-weight:800}
    .answer-reveal{min-height:104px}
    .answer-reveal .reveal-content{display:grid;gap:8px;font-size:.86rem}
    .detail-row{display:grid;grid-template-columns:125px 1fr;gap:8px}
    .detail-label{color:var(--ink);font-weight:850}
    .passage{padding:18px 22px;border-left:4px solid var(--vocab-head);border-radius:0 9px 9px 0;background:var(--panel);font-family:Georgia,"Times New Roman",serif;font-size:1rem;line-height:1.8;white-space:pre-line}
    .passage-title{margin:0 0 9px;color:var(--ink);font-family:system-ui,sans-serif;font-size:.8rem;font-weight:800}
    .passage p{margin:0}
    .reading-note{margin:0 0 13px;color:var(--muted);font-size:.84rem}
    @media(max-width:760px){
      .topbar{padding:0 10px}.date-select{width:113px}.tab{padding:0 8px;font-size:.77rem}
      .page{padding:0 10px}.sheet-head,.section{padding:24px 18px}
      .vocab-toolbar{align-items:flex-start}.vocab-toolbar .section-heading{min-width:0}
      .section-en{display:none}.options{grid-template-columns:1fr}
      .vocab{min-width:780px}.detail-row{grid-template-columns:1fr;gap:0}
    }
    @page{size:A4;margin:14mm 13mm 15mm}
    @media print{
      :root,html[data-theme]{--canvas:#fff;--paper:#fff;--ink:#111;--muted:#444;--line:#bbb;--panel:#fff;--vocab-head:#fff;--teal:#111}
      html,body{width:auto;background:#fff!important;color:#111;font-size:9.5pt;print-color-adjust:economy;-webkit-print-color-adjust:economy}
      .topbar,.status,.pdf-modal{display:none!important}
      .page{width:100%;max-width:100%;margin:0 auto;padding:0}
      .sheet{width:100%;max-width:100%;margin:0 auto;overflow:visible;border:0;border-radius:0;box-shadow:none;background:#fff}
      .sheet-head{padding:0 0 5mm;border-bottom:1px solid #777;background:#fff!important}
      .meta{color:#333}.badge,.overview span{border:1px solid #aaa;background:#fff;color:#111}
      h1{margin:2mm 0 1mm;font-size:15pt}.summary{font-size:9pt}.overview{margin-top:3mm}
      .section{padding:6mm 0;border-bottom:1px solid #bbb}
      .section-heading{margin-bottom:4mm}.section-number{color:#111}h2{font-size:11.5pt}.section-en{color:#555}
      .article-copy{max-width:none;font-size:10pt;line-height:1.55}.article-copy p{margin-bottom:3mm}
      .small-heading{margin-top:4mm}.reveal,.question,.passage{border-color:#aaa;background:#fff!important;box-shadow:none}
      .reveal{min-height:18mm}.reveal-content{padding:2mm 3mm}
      .reveal.is-covered{background:repeating-linear-gradient(to bottom,#fff 0 8mm,#ddd 8.1mm 8.3mm)!important}
      .reveal.is-covered .reveal-content{visibility:hidden}.mask{display:none!important}
      .source-row{margin-top:3mm}.source-link{border:0;padding:0;color:#111}
      .source-link::after{content:" " attr(href);font-weight:400;overflow-wrap:anywhere}
      .vocab-pages{display:none!important}.vocab tr.is-offpage{display:table-row!important}
      .table-wrap{width:100%;overflow:visible}.vocab{width:100%;min-width:0;border:0.5pt solid #aaa;border-collapse:collapse;font-size:8pt}
      .vocab thead,.vocab tbody tr:hover{background:#fff!important;border-radius:0}
      .vocab th,.vocab td{padding:2mm 1.5mm;border:0.5pt solid #aaa;background:#fff!important;text-align:left;vertical-align:top}
      .vocab th{color:#111;border-radius:0!important}
      .vocab tr:last-child td{border:0.5pt solid #aaa}
      .vocab tr,.question,.passage{break-inside:avoid-page;page-break-inside:avoid}
      .vocab .reveal{min-height:13mm}.vocab .reveal-content{padding:1mm}
      .vocab .reveal:not(.is-covered){min-height:0;border:none;background:transparent;padding:0}
      .vocab .reveal:not(.is-covered) .reveal-content{padding:0}
      .question-list{gap:3mm}.question{padding:3mm;border-radius:0}
      .options{gap:1mm 4mm;margin:2mm 0 2mm 6mm}.answer-reveal{min-height:24mm}
      .detail-row{grid-template-columns:26mm 1fr;gap:2mm}
      .passage{padding:3mm;border-left:2px solid #888;border-radius:0;font-size:9.5pt}
      a{text-decoration:none}
    }
  </style>
</head>
<body>
  <nav class="topbar" aria-label="日期、分類與講義工具">
    <div class="nav-left">
      <select id="date-select" class="date-select" aria-label="選擇新聞日期"></select>
      <div class="tabs" role="tablist" aria-label="新聞分類">
        <button type="button" class="tab" role="tab" id="tab-finance" data-category="finance" aria-controls="lesson" aria-selected="true">Finance</button>
        <button type="button" class="tab" role="tab" id="tab-politics" data-category="politics" aria-controls="lesson" aria-selected="false">Politics</button>
        <button type="button" class="tab" role="tab" id="tab-techLife" data-category="techLife" aria-controls="lesson" aria-selected="false">Tech &amp; Life</button>
      </div>
    </div>
    <div class="nav-right">
      <div class="theme-switcher" role="group" aria-label="護眼配色主題">
        <button type="button" class="theme-swatch" data-theme-choice="a" title="燕麥可可" aria-label="燕麥可可主題" aria-pressed="false"></button>
        <button type="button" class="theme-swatch" data-theme-choice="b" title="亞麻玫瑰" aria-label="亞麻玫瑰主題" aria-pressed="false"></button>
        <button type="button" class="theme-swatch" data-theme-choice="c" title="霧青湖水" aria-label="霧青湖水主題" aria-pressed="false"></button>
      </div>
      <button type="button" class="icon-button" id="toggle-all" title="全部顯示" aria-label="全部顯示" aria-pressed="false">
        <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3 21 21M10.6 6.1A11.6 11.6 0 0 1 12 6c6.5 0 10 6 10 6a13.8 13.8 0 0 1-3.1 3.6M6.2 6.8C3.5 8.6 2 12 2 12s3.5 6 10 6c1.4 0 2.7-.3 3.8-.8"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
        <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <button type="button" class="icon-button" id="print-button" title="一鍵匯出彩色 PDF 筆記" aria-label="一鍵匯出彩色 PDF 筆記">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
        <span class="export-label">匯出中...</span>
      </button>
    </div>
  </nav>
  <main class="page">
    <p id="data-status" class="status" role="status" aria-live="polite">正在讀取 data.json…</p>
    <div id="lesson" role="tabpanel" aria-labelledby="tab-finance"></div>
  </main>
  <div id="pdf-modal" class="pdf-modal" hidden>
    <div class="pdf-dialog" role="dialog" aria-modal="true" aria-labelledby="pdf-dialog-title">
      <div class="pdf-dialog-head">
        <h2 id="pdf-dialog-title" class="pdf-dialog-title">PDF 預覽</h2>
        <div class="pdf-dialog-actions">
          <button type="button" id="pdf-confirm" class="pdf-dialog-button" disabled>確認下載 PDF</button>
          <button type="button" id="pdf-close" class="pdf-dialog-button secondary">關閉預覽</button>
        </div>
      </div>
      <div class="pdf-dialog-body">
        <p id="pdf-preview-status" class="pdf-preview-status" role="status">正在產生 PDF 預覽…</p>
        <iframe id="pdf-preview-frame" class="pdf-preview-frame" title="PDF 講義預覽" src="about:blank" hidden></iframe>
      </div>
    </div>
  </div>
  <script>
    "use strict";
    /*
      data.json 格式：
      { "2026-11-11": { "finance": lesson, "politics": lesson, "techLife": lesson }, ... }
      lesson = { title, summary, sourceUrl, sourceLabel, english:[段落], translation:[段落],
        vocabulary:[{term,pos,collocations,meaning,synonyms:[2項],family,sentence}]（固定 10 項）,
        part5:[question×3], part6:{title,passage,questions:[question×4]},
        part7:{intro,questions:[question×3]} }
      question = {prompt, options:[A,B,C,D], answer:"A"~"D", locator, explanation}
      有效的外部日期／分類會覆蓋同日期／分類的內建範例；缺少的部分保留範例。
    */
    const Q = (prompt,options,answer,locator,explanation) => ({prompt,options,answer,locator,explanation});
    const V = (term,pos,collocations,meaning,synonyms,family,sentence) => ({term,pos,collocations,meaning,synonyms,family,sentence});
    const bbc = {

    const categoryKeys=["finance","politics","techLife"];
    const categoryLabels={finance:"Finance",politics:"Politics",techLife:"Tech & Life"};
    const visibleAnswers=new Set();
    const externalLessonIds=new Set();
    let dataByDate=fallbackData;
    let activeDate=Object.keys(fallbackData).sort().reverse()[0];
    let activeCategory="finance";
    let vocabPage=0;
    const themeKeys=["a","b","c"];
    function applyTheme(theme){
      const selected=themeKeys.includes(theme)?theme:"a";
      document.documentElement.dataset.theme=selected;
      document.querySelectorAll(".theme-swatch").forEach(button=>button.setAttribute("aria-pressed",String(button.dataset.themeChoice===selected)));
      try{localStorage.setItem("toeic-news-theme",selected)}catch(_){/* 本機儲存受限時仍可即時切換 */}
    }
    document.querySelectorAll(".theme-swatch").forEach(button=>button.addEventListener("click",()=>applyTheme(button.dataset.themeChoice)));
    applyTheme(document.documentElement.dataset.theme||"a");

    const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
    const semicolonBreaks=value=>String(value??"").replace(/([;；])\s*/g,'$1<br>').split("<br>").map(esc).join("<br>");
    const safeUrl=value=>{try{const url=new URL(String(value));return ["http:","https:"].includes(url.protocol)?url.href:null}catch{return null}};
    const answerId=(section,index="")=>[activeDate,activeCategory,section,index].join(":");
    function revealBox(id,html,kind="答案／詳解",extraClass=""){
      const open=visibleAnswers.has(id);
      return `<div class="reveal ${extraClass} ${open?"":"is-covered"}" data-answer-id="${esc(id)}">
        <div class="reveal-content">${html}</div>
        <button type="button" class="mask" aria-expanded="${open}" aria-label="${open?"重新遮罩":"點擊顯示"+kind}">${open?"重新遮罩":"點擊顯示"+kind}</button>
      </div>`;
    }
    const sectionHeading=(number,zh,en)=>`<div class="section-heading"><span class="section-number">${number}</span><h2>${zh}</h2><span class="section-en">${en}</span></div>`;
    const optionsHtml=options=>`<ol class="options">${options.map((option,i)=>`<li><span class="option-letter">${"ABCD"[i]}.</span>${esc(option)}</li>`).join("")}</ol>`;
    function questionHtml(q,section,index){
      const details=`<div class="detail-row"><span class="detail-label">[答案]</span><span>${esc(q.answer)}. ${esc(q.options["ABCD".indexOf(q.answer)])}</span></div>
        <div class="detail-row"><span class="detail-label">[原文定位與指引]</span><span>${esc(q.locator)}</span></div>
        <div class="detail-row"><span class="detail-label">[詳細解析]</span><span>${esc(q.explanation)}</span></div>`;
      return `<div class="question"><div class="question-top"><span class="q-number">${String(index+1).padStart(2,"0")}</span><p class="prompt">${esc(q.prompt)}</p></div>
        ${optionsHtml(q.options)}${revealBox(answerId(section,index),details,"答案／詳解","answer-reveal")}</div>`;
    }
    function render(){
      const data=dataByDate[activeDate][activeCategory];
      document.getElementById("date-select").value=activeDate;

      const lesson=document.getElementById("lesson");
      lesson.setAttribute("aria-labelledby",`tab-${activeCategory}`);
      const source=safeUrl(data.sourceUrl);
      lesson.innerHTML=`<article class="sheet">
        <header class="sheet-head">
          <div class="meta"><span class="badge">${esc(categoryLabels[activeCategory])}</span><span class="dot">•</span><time datetime="${esc(activeDate)}">${esc(activeDate)}</time><span class="dot">•</span><span>${externalLessonIds.has(activeDate+":"+activeCategory)?"今日講義":"示範情境／非真實新聞"}</span></div>
          <h1>${esc(data.title)}</h1><p class="summary">${esc(data.summary)}</p>
          <div class="overview"><span>News Reading</span><span>Vocabulary × ${data.vocabulary.length}</span><span>Part 5 × 3</span><span>Part 6 × 4</span><span>Part 7 × 3</span></div>
        </header>
        <section class="section" aria-label="新聞文章">
          ${sectionHeading("01","多益風格英文新聞文章","News Reading")}
          <div class="article-copy" lang="en">${data.english.map(p=>`<p>${esc(p)}</p>`).join("")}</div>
          <p class="small-heading">中文翻譯</p>
          ${revealBox(answerId("translation"),data.translation.map(p=>`<p>${esc(p)}</p>`).join(""),"翻譯")}
          <div class="source-row">${source?`<a class="source-link" href="${esc(source)}" target="_blank" rel="noopener noreferrer" title="${esc(data.sourceLabel||"閱讀原文報導")}">${esc(data.sourceLabel||"閱讀原文報導")} ↗</a>`:""}</div>
        </section>
        <section class="section" aria-label="高含金量單字與常用片語">
          <div class="vocab-toolbar">
            ${sectionHeading("02","高含金量單字與常用片語","Vocabulary & Collocations")}
            <div class="vocab-pages" role="group" aria-label="單字表分頁">
              <button type="button" class="vocab-page-button" data-page="0" aria-pressed="${vocabPage===0}">1–5</button>
              <button type="button" class="vocab-page-button" data-page="1" aria-pressed="${vocabPage===1}">6–10</button>
            </div>
          </div>
          <div class="table-wrap"><table class="vocab"><thead><tr><th scope="col">單字／常用片語與固定搭配<br>Collocations</th><th scope="col">中文解釋</th><th scope="col">多益同義替換字</th><th scope="col">同字根詞性家族</th><th scope="col">文章原句</th></tr></thead>
          <tbody>${data.vocabulary.map((v,i)=>`<tr class="${Math.floor(i/5)===vocabPage?"":"is-offpage"}" data-vocab-page="${Math.floor(i/5)}"><td><span class="term">${semicolonBreaks(v.term)}</span> <span class="pos">${semicolonBreaks(v.pos)}</span><div class="collocation">${semicolonBreaks(v.collocations)}</div></td>
            <td>${revealBox(answerId("vocab",i),semicolonBreaks(v.meaning),"中文解釋")}</td><td>${v.synonyms.map(semicolonBreaks).join("<br>")}</td><td>${semicolonBreaks(v.family)}</td><td class="example" lang="en">${semicolonBreaks(v.sentence)}</td></tr>`).join("")}</tbody></table></div>
        </section>
        <section class="section" aria-label="Part 5 單句填空">
          ${sectionHeading("03","Part 5 單句填空","Incomplete Sentences")}
          <div class="question-list">${data.part5.map((q,i)=>questionHtml(q,"part5",i)).join("")}</div>
        </section>
        <section class="section" aria-label="Part 6 段落填空">
          ${sectionHeading("04","Part 6 段落填空","Text Completion")}
          <div class="passage" lang="en"><p class="passage-title">${esc(data.part6.title)}</p><p>${esc(data.part6.passage)}</p></div>
          <p class="small-heading">根據上方信件／公告，選出最適合的答案。</p>
          <div class="question-list">${data.part6.questions.map((q,i)=>questionHtml(q,"part6",i)).join("")}</div>
        </section>
        <section class="section" aria-label="Part 7 閱讀測驗">
          ${sectionHeading("05","Part 7 閱讀測驗","Reading Comprehension")}
          <p class="reading-note">${esc(data.part7.intro)}</p>
          <div class="question-list">${data.part7.questions.map((q,i)=>questionHtml(q,"part7",i)).join("")}</div>
        </section>
      </article>`;
      updateToggle();
    }
    function currentIds(){return [...document.querySelectorAll("#lesson .reveal")].map(el=>el.dataset.answerId)}
    function updateToggle(){
      const ids=currentIds(),allOpen=ids.length>0&&ids.every(id=>visibleAnswers.has(id));
      const button=document.getElementById("toggle-all");
      const label=allOpen?"全部遮罩":"全部顯示";
      button.title=label;button.setAttribute("aria-label",label);button.setAttribute("aria-pressed",String(allOpen));
    }
    function showVocabPage(page){
      vocabPage=page;
      document.querySelectorAll(".vocab tbody tr").forEach(row=>row.classList.toggle("is-offpage",Number(row.dataset.vocabPage)!==page));
      document.querySelectorAll(".vocab-page-button").forEach(button=>button.setAttribute("aria-pressed",String(Number(button.dataset.page)===page)));
    }
    document.getElementById("lesson").addEventListener("click",event=>{
      const pageButton=event.target.closest(".vocab-page-button");
      if(pageButton){showVocabPage(Number(pageButton.dataset.page));return}
      const button=event.target.closest(".mask");if(!button)return;
      const box=button.closest(".reveal"),id=box.dataset.answerId;
      if(visibleAnswers.has(id))visibleAnswers.delete(id);else visibleAnswers.add(id);
      const open=visibleAnswers.has(id),kind=id.includes(":translation:")?"翻譯":id.includes(":vocab:")?"中文解釋":"答案／詳解";
      box.classList.toggle("is-covered",!open);
      button.textContent=open?"重新遮罩":"點擊顯示"+kind;
      button.setAttribute("aria-label",button.textContent);button.setAttribute("aria-expanded",String(open));
      updateToggle();
    });
    document.getElementById("toggle-all").addEventListener("click",()=>{
      const ids=currentIds(),allOpen=ids.every(id=>visibleAnswers.has(id));
      ids.forEach(id=>allOpen?visibleAnswers.delete(id):visibleAnswers.add(id));render();
    });
    const pdfModal=document.getElementById("pdf-modal");
    const pdfFrame=document.getElementById("pdf-preview-frame");
    const pdfStatus=document.getElementById("pdf-preview-status");
    const pdfConfirm=document.getElementById("pdf-confirm");
    let previewPdfUrl="";
    let previewFilename="";
    let previewGeneration=0;
    function closePdfPreview(){
      previewGeneration++;
      pdfModal.hidden=true;
      pdfFrame.src="about:blank";
      pdfFrame.hidden=true;
      pdfConfirm.disabled=true;
      if(previewPdfUrl)URL.revokeObjectURL(previewPdfUrl);
      previewPdfUrl="";
      previewFilename="";
      document.getElementById("print-button").focus();
    }
    document.getElementById("pdf-close").addEventListener("click",closePdfPreview);
    pdfModal.addEventListener("click",event=>{if(event.target===pdfModal)closePdfPreview()});
    document.addEventListener("keydown",event=>{if(event.key==="Escape"&&!pdfModal.hidden)closePdfPreview()});
    pdfConfirm.addEventListener("click",()=>{
      if(!previewPdfUrl)return;
      const link=document.createElement("a");
      link.href=previewPdfUrl;
      link.download=previewFilename;
      document.body.append(link);
      link.click();
      link.remove();
    });
    async function downloadColorPdf(){
      const button=document.getElementById("print-button");
      if(button.disabled||!pdfModal.hidden)return;
      const card=document.querySelector("#lesson > .sheet");
      if(!card)return;
      const generation=++previewGeneration;
      const exportDate=activeDate;
      const exportCategory=categoryLabels[activeCategory];
      const rows=[...card.querySelectorAll(".vocab tbody tr")];
      const hiddenRows=rows.map(row=>row.classList.contains("is-offpage"));
      const originalTitle=button.title;
      const originalLabel=button.getAttribute("aria-label");
      const originalExportLabel=button.querySelector(".export-label").textContent;
      const originalCardStyle={margin:card.style.margin,width:card.style.width,maxWidth:card.style.maxWidth,borderRadius:card.style.borderRadius,boxShadow:card.style.boxShadow};
      pdfModal.hidden=false;
      pdfStatus.textContent="正在產生 PDF 預覽…";
      pdfStatus.hidden=false;
      pdfFrame.hidden=true;
      pdfConfirm.disabled=true;
      document.getElementById("pdf-close").focus();
      button.disabled=true;
      button.classList.add("is-exporting");
      button.querySelector(".export-label").textContent="預覽中...";
      button.title="預覽中...";
      button.setAttribute("aria-label","預覽中...");
      button.setAttribute("aria-busy","true");
      card.classList.add("pdf-exporting");
      card.style.margin="0";
      card.style.width="710px";
      card.style.maxWidth="710px";
      card.style.borderRadius="0";
      card.style.boxShadow="none";
      rows.forEach(row=>row.classList.remove("is-offpage"));
      try{
        if(typeof window.html2pdf!=="function")throw new Error("html2pdf.js 尚未載入，請確認網路連線。");
        if(document.fonts?.ready)await document.fonts.ready;
        await new Promise(resolve=>requestAnimationFrame(resolve));
        const categoryName=exportCategory.replace(/\s*&\s*/g,"_and_").replace(/\s+/g,"_");
        const options={
          margin:[10,10,10,10],
          filename:`TOEIC_${exportDate}_${categoryName}.pdf`,
          image:{type:"jpeg",quality:0.98},
          html2canvas:{scale:2,x:0,y:0,scrollX:0,scrollY:0,windowWidth:710,useCORS:true,backgroundColor:getComputedStyle(card).backgroundColor},
          jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},
          pagebreak:{mode:["avoid-all","css","legacy"]}
        };
        const url=await window.html2pdf().from(card).set(options).outputPdf("bloburl");
        if(generation!==previewGeneration){URL.revokeObjectURL(url);return}
        previewPdfUrl=url;
        previewFilename=options.filename;
        pdfFrame.src=url;
        pdfFrame.hidden=false;
        pdfStatus.hidden=true;
        pdfConfirm.disabled=false;
      }catch(error){
        console.error("PDF 匯出失敗：",error);
        if(generation===previewGeneration){
          pdfStatus.textContent=`PDF 預覽失敗：${error.message||"請稍後再試。"}`;
          pdfStatus.hidden=false;
        }
      }finally{
        rows.forEach((row,index)=>row.classList.toggle("is-offpage",hiddenRows[index]));
        card.style.margin=originalCardStyle.margin;
        card.style.width=originalCardStyle.width;
        card.style.maxWidth=originalCardStyle.maxWidth;
        card.style.borderRadius=originalCardStyle.borderRadius;
        card.style.boxShadow=originalCardStyle.boxShadow;
        card.classList.remove("pdf-exporting");
        button.disabled=false;
        button.classList.remove("is-exporting");
        button.querySelector(".export-label").textContent=originalExportLabel;
        button.title=originalTitle;
        button.setAttribute("aria-label",originalLabel);
        button.removeAttribute("aria-busy");
      }
    }
    document.getElementById("print-button").addEventListener("click",downloadColorPdf);
    document.querySelectorAll(".tab").forEach(tab=>tab.addEventListener("click",()=>{activeCategory=tab.dataset.category;vocabPage=0;render()}));
    document.querySelector(".tabs").addEventListener("keydown",event=>{
      if(!["ArrowLeft","ArrowRight","Home","End"].includes(event.key))return;
      event.preventDefault();const current=categoryKeys.indexOf(activeCategory);
      const next=event.key==="Home"?0:event.key==="End"?categoryKeys.length-1:(current+(event.key==="ArrowRight"?1:-1)+categoryKeys.length)%categoryKeys.length;
      activeCategory=categoryKeys[next];vocabPage=0;render();document.getElementById(`tab-${activeCategory}`).focus();
    });
    document.getElementById("date-select").addEventListener("change",event=>{activeDate=event.target.value;vocabPage=0;render()});

    const isText=value=>typeof value==="string";
    const validQuestion=q=>q&&isText(q.prompt)&&Array.isArray(q.options)&&q.options.length===4&&q.options.every(isText)&&/^[A-D]$/.test(q.answer)&&isText(q.locator)&&isText(q.explanation);
    const validLesson=d=>d&&isText(d.title)&&isText(d.summary)&&Array.isArray(d.english)&&d.english.length>0&&d.english.every(isText)
      &&Array.isArray(d.translation)&&d.translation.length>0&&d.translation.every(isText)
      &&Array.isArray(d.vocabulary)&&d.vocabulary.length===10&&d.vocabulary.every(v=>v&&isText(v.term)&&isText(v.pos)&&isText(v.collocations)&&isText(v.meaning)&&Array.isArray(v.synonyms)&&v.synonyms.length===2&&v.synonyms.every(isText)&&isText(v.family)&&isText(v.sentence))
      &&Array.isArray(d.part5)&&d.part5.length===3&&d.part5.every(validQuestion)
      &&d.part6&&isText(d.part6.title)&&isText(d.part6.passage)&&Array.isArray(d.part6.questions)&&d.part6.questions.length===4&&d.part6.questions.every(validQuestion)
      &&d.part7&&isText(d.part7.intro)&&Array.isArray(d.part7.questions)&&d.part7.questions.length===3&&d.part7.questions.every(validQuestion);
    function fillDateSelect(){
      const dates=Object.keys(dataByDate).sort().reverse();
      const select=document.getElementById("date-select");
      select.innerHTML=dates.map(date=>`<option value="${esc(date)}">${esc(date)}</option>`).join("");
      if(!dates.includes(activeDate))activeDate=dates[0];
      select.value=activeDate;
    }
    async function loadData(){
      try{
        const response=await fetch("./data.json",{cache:"no-store"});
        if(!response.ok)throw new Error("HTTP "+response.status);
        const external=await response.json();
        if(!external||typeof external!=="object"||Array.isArray(external))throw new Error("資料格式不正確");
        const merged=JSON.parse(JSON.stringify(fallbackData));let count=0;
        for(const [date,group] of Object.entries(external)){
          if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!group||typeof group!=="object")continue;
          for(const key of categoryKeys){
            if(validLesson(group[key])){if(!merged[date])merged[date]={};merged[date][key]=group[key];externalLessonIds.add(date+":"+key);count++}
          }
        }
        if(!count)throw new Error("沒有可用講義");
        for(const date of Object.keys(merged)){
          if(!categoryKeys.every(key=>validLesson(merged[date][key]))){delete merged[date];categoryKeys.forEach(key=>externalLessonIds.delete(date+":"+key))}
        }
        dataByDate=merged;
        activeDate=Object.keys(dataByDate).sort().reverse()[0];
        document.getElementById("data-status").textContent=`已載入 data.json 的 ${count} 篇講義；缺少的日期或分類使用內建範例。`;
      }catch{
        dataByDate=fallbackData;
        externalLessonIds.clear();
        document.getElementById("data-status").textContent="目前顯示兩天的完整範例講義。直接開啟本機 HTML 時，瀏覽器可能限制讀取 data.json。";
      }
      fillDateSelect();render();
    }
    fillDateSelect();render();loadData();
  </script>
</body>
</html>
