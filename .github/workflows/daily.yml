name: Daily TOEIC news

on:
  schedule:
    # 22:17 UTC is 06:17 the next day in Taiwan (UTC+8).
    - cron: '17 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-toeic-news-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade google-genai feedparser pydantic

      - name: Generate today's lessons
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_news.py

      - name: Commit and push updated data
        run: |
          git add data.json
          if git diff --cached --quiet; then
            echo "data.json is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update TOEIC news for $(TZ=Asia/Taipei date +%F)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
